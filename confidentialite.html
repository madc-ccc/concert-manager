const D={"en": {"t": "Privacy policy", "u": "Last updated: 16 November 2026", "back": "Back to the app", "S": [["Who is responsible", "In The Pit is published by Zion Hut Studio (Pascal Berne). Contact for any question about your data: contact_I.n-T@he-P.it. In The Pit is intended for people aged 15 and over."], ["What we collect", "Your email address and password (stored hashed), the name you choose, and the content you add: concerts, tickets (PDF files and photos), venue memberships, notes, band photos, nicknames for your friends, your sharing choices, your language and reminder settings. If you set a home location for the distance filter, it is stored rounded to about 1 km and visible only to you. If you enable reminders, a push subscription of your device is stored."], ["Why", "To run the service: keep your concert diary, show it to the friends you choose, send reminders, and read your PDF tickets. Nothing is used for advertising and nothing is sold. Legal bases: providing the service you signed up for (contract) for your account and its features; our legitimate interest for security (anti-bot check, usage limits) and for removing inactive accounts; your consent for optional features (reminders, public list, home location, AI reading of tickets when the vault is on), which you can withdraw at any time in Options."], ["Who receives data (service providers)", "Supabase (database, files, accounts; servers in Paris, France); Netlify (hosting); Resend (confirmation and notification emails); Anthropic (an AI reads the PDF tickets you import to fill in artist, date, venue and price; it is instructed to ignore your name, address and barcodes; the QR code or barcode itself is read on your phone); OpenStreetMap Nominatim (names of cities, to compute distances); Wikipedia and Deezer (searching for band photos by band name); Cloudflare (Turnstile anti-bot check when you sign in or sign up; it receives your IP address and technical browser data); jsDelivr (a public library host, which receives your IP address). Some of these providers are established outside the European Union, mainly in the United States. Those transfers are covered by the European Commission’s standard contractual clauses or by the EU-US Data Privacy Framework, depending on the provider. Fonts are served from our own site, with no call to Google."], ["What other people see", "Friends you share with see your concerts (not your prices, notes or tickets, except photos and notes of past paper tickets). If you tick “Show my concerts anonymously in the public list”, your concerts appear without your name, notes, prices or tickets. Band photos are shared between all users; you can report a photo and remove your own."], ["Ticket vault (optional)", "If you turn on the ticket vault in Options, your PDF tickets are encrypted on your phone with a passphrase before upload. The passphrase never leaves your device, so neither we nor our providers can read those files, and nothing can recover them if you forget it. Automatic reading of those tickets by AI is then off, unless you choose it for a given ticket."], ["How long", "Until you delete your account. An account that has not been used for one year is deleted automatically with all its content; a warning email is sent 30 days before, and signing in is enough to keep it. Sign-ups whose email address is never confirmed are deleted after 7 days. Venue membership cards are removed 30 days after they expire. When an account is deleted, all its data and files are erased."], ["Your rights", "In Options you can export all your data and permanently delete your account. You can also ask for access, correction or erasure, or object to processing, by writing to the address above. You may lodge a complaint with the CNIL (cnil.fr)."], ["Cookies and storage", "No tracking or advertising cookies. The app keeps settings (language, filters) and an offline copy of your list and tickets in your device’s own storage. Deleting your account clears them."], ["Changes", "If this policy changes in a meaningful way, the change history of the app will say so."]]}, "fr": {"t": "Politique de confidentialité", "u": "Dernière mise à jour : 16 novembre 2026", "back": "Retour à l’app", "S": [["Qui est responsable", "In The Pit est édité par Zion Hut Studio (Pascal Berne). Contact pour toute question sur vos données : contact_I.n-T@he-P.it. In The Pit s’adresse aux personnes de 15 ans et plus."], ["Ce que nous collectons", "Votre adresse e-mail et votre mot de passe (stocké chiffré), le nom que vous choisissez, et le contenu que vous ajoutez : concerts, billets (fichiers PDF et photos), abonnements aux salles, notes, photos de groupes, surnoms donnés à vos amis, vos choix de partage, votre langue et vos réglages de rappels. Si vous définissez un domicile pour le filtre de distance, il est enregistré arrondi à environ 1 km et visible de vous seul. Si vous activez les rappels, l’abonnement push de votre appareil est enregistré."], ["Pourquoi", "Pour faire fonctionner le service : tenir votre carnet de concerts, le montrer aux amis que vous choisissez, envoyer des rappels et lire vos billets PDF. Rien n’est utilisé pour de la publicité et rien n’est vendu. Bases légales : la fourniture du service auquel vous vous êtes inscrit (contrat) pour votre compte et ses fonctions ; notre intérêt légitime pour la sécurité (contrôle anti-robot, limites d’usage) et la suppression des comptes inactifs ; votre consentement pour les fonctions facultatives (rappels, liste publique, domicile, lecture des billets par l’IA lorsque le coffre est actif), que vous pouvez retirer à tout moment dans les Options."], ["Qui reçoit des données (prestataires)", "Supabase (base de données, fichiers, comptes ; serveurs à Paris, France) ; Netlify (hébergement) ; Resend (e-mails de confirmation et de notification) ; Anthropic (une IA lit les billets PDF que vous importez pour remplir artiste, date, salle et prix ; elle a pour consigne d’ignorer votre nom, votre adresse et les codes-barres ; le QR code ou code-barres lui-même est lu sur votre téléphone) ; OpenStreetMap Nominatim (noms de villes, pour calculer les distances) ; Wikipédia et Deezer (recherche de photos de groupes à partir du nom du groupe) ; Cloudflare (contrôle anti-robot Turnstile à la connexion et à l’inscription ; il reçoit votre adresse IP et des données techniques du navigateur) ; jsDelivr (hébergeur public de bibliothèques, qui reçoit votre adresse IP). Certains de ces prestataires sont établis hors de l’Union européenne, principalement aux États-Unis. Ces transferts sont encadrés par les clauses contractuelles types de la Commission européenne ou par le cadre de protection des données UE–États-Unis, selon le prestataire. Les polices de caractères sont servies depuis notre propre site, sans appel à Google."], ["Ce que les autres voient", "Les amis avec qui vous partagez voient vos concerts (pas vos prix, notes ni billets, sauf les photos et notes de vieux billets papier). Si vous cochez « Afficher mes concerts, anonymement, dans la liste publique des invités », vos concerts apparaissent sans votre nom, ni notes, prix ou billets. Les photos de groupes sont partagées entre tous les utilisateurs ; vous pouvez signaler une photo et retirer la vôtre."], ["Coffre à billets (facultatif)", "Si vous activez le coffre à billets dans les Options, vos billets PDF sont chiffrés sur votre téléphone avec une phrase secrète avant l’envoi. Cette phrase ne quitte jamais votre appareil : ni nous ni nos prestataires ne pouvons lire ces fichiers, et rien ne permet de les récupérer si vous l’oubliez. La lecture automatique de ces billets par l’IA est alors désactivée, sauf si vous la choisissez pour un billet donné."], ["Combien de temps", "Jusqu’à la suppression de votre compte. Un compte non utilisé pendant un an est supprimé automatiquement avec tout son contenu ; un e-mail d’avertissement est envoyé 30 jours avant, et il suffit de se connecter pour le conserver. Les inscriptions dont l’adresse e-mail n’est jamais confirmée sont supprimées après 7 jours. Les cartes d’abonnement sont supprimées 30 jours après leur expiration. À la suppression d’un compte, toutes ses données et tous ses fichiers sont effacés."], ["Vos droits", "Dans les Options, vous pouvez exporter toutes vos données et supprimer définitivement votre compte. Vous pouvez aussi demander l’accès, la rectification ou l’effacement, ou vous opposer à un traitement, en écrivant à l’adresse ci-dessus. Vous pouvez adresser une réclamation à la CNIL (cnil.fr)."], ["Cookies et stockage", "Aucun cookie de suivi ni de publicité. L’app conserve vos réglages (langue, filtres) et une copie hors ligne de votre liste et de vos billets dans le stockage propre à votre appareil. La suppression du compte les efface."], ["Modifications", "Si cette politique change de façon significative, l’historique des modifications de l’app le mentionnera."]]}, "es": {"t": "Política de privacidad", "u": "Última actualización: 16 de noviembre de 2026", "back": "Volver a la app", "S": [["Quién es responsable", "In The Pit está editada por Zion Hut Studio (Pascal Berne). Contacto para cualquier pregunta sobre tus datos: contact_I.n-T@he-P.it. In The Pit está destinada a personas de 15 años o más."], ["Qué recogemos", "Tu correo electrónico y contraseña (almacenada cifrada), el nombre que elijas y el contenido que añades: conciertos, entradas (archivos PDF y fotos), abonos de salas, notas, fotos de grupos, apodos de tus amigos, tus opciones de compartición, tu idioma y ajustes de recordatorios. Si defines un domicilio para el filtro de distancia, se guarda redondeado a 1 km aproximadamente y solo tú lo ves. Si activas los recordatorios, se guarda la suscripción push de tu dispositivo."], ["Para qué", "Para hacer funcionar el servicio: llevar tu diario de conciertos, mostrarlo a los amigos que elijas, enviar recordatorios y leer tus entradas en PDF. Nada se usa para publicidad y nada se vende. Bases jurídicas: la prestación del servicio en el que te registraste (contrato) para tu cuenta y sus funciones; nuestro interés legítimo para la seguridad (control antirrobots, límites de uso) y la eliminación de cuentas inactivas; tu consentimiento para las funciones opcionales (recordatorios, lista pública, domicilio, lectura de entradas por IA cuando la caja fuerte está activa), que puedes retirar en cualquier momento en Opciones."], ["Quién recibe datos (proveedores)", "Supabase (base de datos, archivos, cuentas; servidores en París, Francia); Netlify (alojamiento); Resend (correos de confirmación y notificación); Anthropic (una IA lee las entradas PDF que importas para rellenar artista, fecha, sala y precio; tiene la consigna de ignorar tu nombre, dirección y códigos de barras; el código QR o de barras en sí se lee en tu teléfono); OpenStreetMap Nominatim (nombres de ciudades, para calcular distancias); Wikipedia y Deezer (búsqueda de fotos de grupos por nombre); Cloudflare (control antirrobots Turnstile al iniciar sesión o registrarte; recibe tu dirección IP y datos técnicos del navegador); jsDelivr (alojamiento público de bibliotecas, que recibe tu dirección IP). Algunos de estos proveedores están establecidos fuera de la Unión Europea, principalmente en Estados Unidos. Esas transferencias están cubiertas por las cláusulas contractuales tipo de la Comisión Europea o por el Marco de Privacidad de Datos UE-EE. UU., según el proveedor. Las fuentes se sirven desde nuestro propio sitio, sin llamadas a Google."], ["Qué ven los demás", "Los amigos con quienes compartes ven tus conciertos (no tus precios, notas ni entradas, salvo fotos y notas de entradas de papel antiguas). Si marcas «Mostrar mis conciertos, de forma anónima, en la lista pública», tus conciertos aparecen sin tu nombre, notas, precios ni entradas. Las fotos de grupos se comparten entre todos; puedes denunciar una foto y retirar la tuya."], ["Caja fuerte de entradas (opcional)", "Si activas la caja fuerte de entradas en Opciones, tus entradas PDF se cifran en tu teléfono con una frase secreta antes de enviarse. La frase nunca sale de tu dispositivo, así que ni nosotros ni nuestros proveedores podemos leer esos archivos, y nada permite recuperarlos si la olvidas. La lectura automática de esas entradas por IA queda desactivada, salvo que la elijas para una entrada concreta."], ["Cuánto tiempo", "Hasta que elimines tu cuenta. Una cuenta que no se usa durante un año se elimina automáticamente con todo su contenido; se envía un correo de aviso 30 días antes y basta con iniciar sesión para conservarla. Los registros cuyo correo nunca se confirma se eliminan a los 7 días. Los abonos se eliminan 30 días después de caducar. Al eliminar una cuenta se borran todos sus datos y archivos."], ["Tus derechos", "En Opciones puedes exportar todos tus datos y eliminar definitivamente tu cuenta. También puedes solicitar acceso, rectificación o supresión, u oponerte a un tratamiento, escribiendo a la dirección indicada. Puedes presentar una reclamación ante la CNIL (cnil.fr) o tu autoridad de control."], ["Cookies y almacenamiento", "Sin cookies de seguimiento ni publicidad. La app guarda tus ajustes (idioma, filtros) y una copia sin conexión de tu lista y entradas en el almacenamiento de tu dispositivo. Eliminar la cuenta los borra."], ["Cambios", "Si esta política cambia de forma significativa, el historial de cambios de la app lo indicará."]]}, "it": {"t": "Informativa sulla privacy", "u": "Ultimo aggiornamento: 16 novembre 2026", "back": "Torna all’app", "S": [["Chi è responsabile", "In The Pit è pubblicata da Zion Hut Studio (Pascal Berne). Contatto per qualsiasi domanda sui tuoi dati: contact_I.n-T@he-P.it. In The Pit è destinata a persone di almeno 15 anni."], ["Cosa raccogliamo", "Il tuo indirizzo e-mail e la password (conservata cifrata), il nome che scegli e i contenuti che aggiungi: concerti, biglietti (file PDF e foto), abbonamenti ai locali, note, foto dei gruppi, soprannomi dei tuoi amici, le tue scelte di condivisione, la lingua e le impostazioni dei promemoria. Se imposti un domicilio per il filtro distanza, viene salvato arrotondato a circa 1 km e visibile solo a te. Se attivi i promemoria, viene salvata la sottoscrizione push del tuo dispositivo."], ["Perché", "Per far funzionare il servizio: tenere il tuo diario dei concerti, mostrarlo agli amici che scegli, inviare promemoria e leggere i tuoi biglietti PDF. Nulla è usato per pubblicità e nulla viene venduto. Basi giuridiche: la fornitura del servizio a cui ti sei iscritto (contratto) per il tuo account e le sue funzioni; il nostro legittimo interesse per la sicurezza (controllo anti-bot, limiti di utilizzo) e per l’eliminazione degli account inattivi; il tuo consenso per le funzioni facoltative (promemoria, elenco pubblico, domicilio, lettura dei biglietti tramite IA quando la cassaforte è attiva), che puoi revocare in qualsiasi momento nelle Opzioni."], ["Chi riceve dati (fornitori)", "Supabase (database, file, account; server a Parigi, Francia); Netlify (hosting); Resend (e-mail di conferma e notifica); Anthropic (un’IA legge i biglietti PDF che importi per compilare artista, data, locale e prezzo; ha l’istruzione di ignorare nome, indirizzo e codici a barre; il codice QR o a barre vero e proprio viene letto sul tuo telefono); OpenStreetMap Nominatim (nomi delle città, per calcolare le distanze); Wikipedia e Deezer (ricerca di foto dei gruppi dal nome); Cloudflare (controllo anti-bot Turnstile all’accesso e alla registrazione; riceve il tuo indirizzo IP e dati tecnici del browser); jsDelivr (hosting pubblico di librerie, che riceve il tuo indirizzo IP). Alcuni di questi fornitori hanno sede fuori dall’Unione Europea, principalmente negli Stati Uniti. Tali trasferimenti sono coperti dalle clausole contrattuali tipo della Commissione europea o dal Data Privacy Framework UE-USA, a seconda del fornitore. I caratteri sono serviti dal nostro sito, senza chiamate a Google."], ["Cosa vedono gli altri", "Gli amici con cui condividi vedono i tuoi concerti (non prezzi, note o biglietti, salvo foto e note di vecchi biglietti cartacei). Se selezioni «Mostra i miei concerti, in modo anonimo, nell’elenco pubblico», i tuoi concerti compaiono senza nome, note, prezzi o biglietti. Le foto dei gruppi sono condivise tra tutti; puoi segnalare una foto e rimuovere la tua."], ["Cassaforte dei biglietti (facoltativa)", "Se attivi la cassaforte dei biglietti nelle Opzioni, i tuoi biglietti PDF vengono crittografati sul tuo telefono con una frase segreta prima dell’invio. La frase non lascia mai il tuo dispositivo, quindi né noi né i nostri fornitori possiamo leggere quei file, e nulla permette di recuperarli se la dimentichi. La lettura automatica di quei biglietti tramite IA resta disattivata, a meno che tu non la scelga per un biglietto specifico."], ["Per quanto tempo", "Fino a quando elimini il tuo account. Un account non utilizzato per un anno viene eliminato automaticamente con tutto il suo contenuto; 30 giorni prima viene inviata un’e-mail di avviso e basta accedere per conservarlo. Le registrazioni il cui indirizzo e-mail non viene mai confermato sono eliminate dopo 7 giorni. Gli abbonamenti vengono rimossi 30 giorni dopo la scadenza. Eliminando un account, tutti i suoi dati e file vengono cancellati."], ["I tuoi diritti", "In Opzioni puoi esportare tutti i tuoi dati ed eliminare definitivamente il tuo account. Puoi anche chiedere accesso, rettifica o cancellazione, o opporti a un trattamento, scrivendo all’indirizzo sopra. Puoi presentare reclamo alla CNIL (cnil.fr) o alla tua autorità di controllo."], ["Cookie e archiviazione", "Nessun cookie di tracciamento o pubblicitario. L’app conserva le impostazioni (lingua, filtri) e una copia offline di elenco e biglietti nell’archivio del tuo dispositivo. Eliminare l’account li cancella."], ["Modifiche", "Se questa informativa cambia in modo significativo, lo storico delle modifiche dell’app lo indicherà."]]}, "de": {"t": "Datenschutzerklärung", "u": "Zuletzt aktualisiert: 16. November 2026", "back": "Zurück zur App", "S": [["Verantwortlicher", "In The Pit wird von Zion Hut Studio (Pascal Berne) herausgegeben. Kontakt für alle Fragen zu deinen Daten: contact_I.n-T@he-P.it. In The Pit richtet sich an Personen ab 15 Jahren."], ["Was wir erheben", "Deine E-Mail-Adresse und dein Passwort (verschlüsselt gespeichert), den von dir gewählten Namen und die Inhalte, die du hinzufügst: Konzerte, Tickets (PDF-Dateien und Fotos), Mitgliedschaften von Hallen, Notizen, Bandfotos, Spitznamen deiner Freunde, deine Freigaben, deine Sprache und Erinnerungseinstellungen. Wenn du für den Entfernungsfilter einen Wohnort angibst, wird er auf etwa 1 km gerundet gespeichert und ist nur für dich sichtbar. Wenn du Erinnerungen aktivierst, wird das Push-Abonnement deines Geräts gespeichert."], ["Wofür", "Um den Dienst zu betreiben: dein Konzerttagebuch führen, es den von dir gewählten Freunden zeigen, Erinnerungen senden und deine PDF-Tickets lesen. Nichts wird für Werbung genutzt, nichts wird verkauft. Rechtsgrundlagen: die Bereitstellung des Dienstes, für den du dich angemeldet hast (Vertrag), für dein Konto und seine Funktionen; unser berechtigtes Interesse an der Sicherheit (Bot-Schutz, Nutzungsgrenzen) und am Löschen inaktiver Konten; deine Einwilligung für optionale Funktionen (Erinnerungen, öffentliche Liste, Wohnort, KI-Auslesen von Tickets bei aktivem Tresor), die du jederzeit in den Optionen widerrufen kannst."], ["Wer Daten erhält (Dienstleister)", "Supabase (Datenbank, Dateien, Konten; Server in Paris, Frankreich); Netlify (Hosting); Resend (Bestätigungs- und Benachrichtigungs-E-Mails); Anthropic (eine KI liest die importierten PDF-Tickets, um Künstler, Datum, Halle und Preis auszufüllen; sie soll deinen Namen, deine Adresse und Barcodes ignorieren; der QR-Code oder Barcode selbst wird auf deinem Handy gelesen); OpenStreetMap Nominatim (Städtenamen zur Entfernungsberechnung); Wikipedia und Deezer (Suche nach Bandfotos anhand des Bandnamens); Cloudflare (Bot-Schutz Turnstile bei Anmeldung und Registrierung; erhält deine IP-Adresse und technische Browserdaten); jsDelivr (öffentlicher Host für Bibliotheken, der deine IP-Adresse erhält). Einige dieser Dienstleister sitzen außerhalb der Europäischen Union, vor allem in den USA. Diese Übermittlungen sind je nach Dienstleister durch die Standardvertragsklauseln der Europäischen Kommission oder das EU-US Data Privacy Framework abgesichert. Schriftarten werden von unserer eigenen Website geladen, ohne Aufruf bei Google."], ["Was andere sehen", "Freunde, mit denen du teilst, sehen deine Konzerte (nicht deine Preise, Notizen oder Tickets, außer Fotos und Notizen alter Papiertickets). Wenn du „Meine Konzerte anonym in der öffentlichen Liste anzeigen“ aktivierst, erscheinen deine Konzerte ohne Namen, Notizen, Preise oder Tickets. Bandfotos werden unter allen Nutzern geteilt; du kannst ein Foto melden und dein eigenes entfernen."], ["Ticket-Tresor (optional)", "Wenn du in den Optionen den Ticket-Tresor aktivierst, werden deine PDF-Tickets vor dem Hochladen auf deinem Handy mit einer Passphrase verschlüsselt. Die Passphrase verlässt dein Gerät nie, daher können weder wir noch unsere Dienstleister diese Dateien lesen, und nichts stellt sie wieder her, falls du sie vergisst. Das automatische Auslesen dieser Tickets per KI ist dann aus, es sei denn, du wählst es für ein bestimmtes Ticket."], ["Wie lange", "Bis du dein Konto löschst. Ein Konto, das ein Jahr lang nicht genutzt wurde, wird automatisch mit allen Inhalten gelöscht; 30 Tage vorher wird eine Warn-E-Mail gesendet, und eine Anmeldung genügt, um es zu behalten. Registrierungen, deren E-Mail-Adresse nie bestätigt wird, werden nach 7 Tagen gelöscht. Mitgliedskarten werden 30 Tage nach Ablauf entfernt. Beim Löschen eines Kontos werden alle Daten und Dateien gelöscht."], ["Deine Rechte", "In den Optionen kannst du alle deine Daten exportieren und dein Konto endgültig löschen. Du kannst auch Auskunft, Berichtigung oder Löschung verlangen oder einer Verarbeitung widersprechen, indem du an die oben genannte Adresse schreibst. Du kannst dich bei der CNIL (cnil.fr) oder deiner Aufsichtsbehörde beschweren."], ["Cookies und Speicher", "Keine Tracking- oder Werbe-Cookies. Die App speichert Einstellungen (Sprache, Filter) und eine Offline-Kopie von Liste und Tickets im Speicher deines Geräts. Das Löschen des Kontos entfernt sie."], ["Änderungen", "Wenn sich diese Erklärung wesentlich ändert, weist der Änderungsverlauf der App darauf hin."]]}};
const q=new URLSearchParams(location.search).get('lang');let L=q&&D[q]?q:null;

document.title=d.t+' - In The Pit';document.getElementById('t').textContent=d.t;document.getElementById('u').textContent=d.u;

function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
